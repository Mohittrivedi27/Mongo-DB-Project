server:
  port: 8080

spring:
  application:
    name: personalized-job-application-system
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/job_automation_db}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: job-application-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:user@example.com}
    password: ${EMAIL_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  email:
    from: ${EMAIL_FROM:noreply@jobautomation.com}
    max-daily: ${MAX_EMAILS_PER_DAY:50}
    max-hourly: ${MAX_EMAILS_PER_HOUR:10}
  google:
    client-id: ${GOOGLE_CLIENT_ID:mock-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:mock-client-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
